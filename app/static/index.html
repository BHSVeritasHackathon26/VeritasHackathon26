<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thought-to-Text</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='9' fill='%235b9bf0'/%3E%3Cg stroke='%235b9bf0' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M32 8l-4 4M12 28l-4 4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e2a47; --blue: #5b9bf0; --pale: #e4eefc; --card: #ffffff; --bg: #ffffff;
    --edge: #dfe8f6; --mute: #6f83ab; --green: #22b573; --bad: #d94b58;
    --head: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--navy); font-family: var(--body); min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px 56px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .brand svg { width: 44px; height: 44px; flex: none; }
  .brand b { font: 700 18px var(--head); letter-spacing: -.005em; }
  h1 { font: 700 clamp(34px, 6.4vw, 52px)/1.08 var(--head); margin: 0 0 30px; letter-spacing: -.02em; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* the three boxes */
  .card { background: var(--card); border: 2px solid var(--edge); border-radius: 22px; overflow: hidden; transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 1px 2px rgba(30,42,71,.04), 0 8px 24px -12px rgba(30,42,71,.14); }
  .card.active { border-color: var(--blue); box-shadow: 0 0 0 5px rgba(91,155,240,.14), 0 8px 24px -12px rgba(30,42,71,.18); }
  .card header { display: flex; align-items: center; gap: 12px; padding: 18px 24px 0; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; font: 600 14px var(--head);
    display: grid; place-items: center; flex: none; }
  .card.done .num { background: var(--green); }
  h2 { font: 600 19px var(--head); margin: 0; letter-spacing: -.005em; }
  .side { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--mute); font-weight: 600; }
  .body { padding: 16px 24px 24px; }
  .arrow { display: grid; place-items: center; height: 34px; color: var(--blue); }
  .arrow svg { width: 22px; height: 22px; }

  /* 1 · input */
  .drop { border: 2px dashed #b4cdf2; border-radius: 16px; padding: 30px 20px 32px; text-align: center; cursor: pointer;
    transition: .15s; outline: none; background: #f7faff; }
  .drop .ico { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 14px; background: var(--pale); color: var(--blue); display: grid; place-items: center; }
  .drop .ico svg { width: 24px; height: 24px; }
  .drop:hover, .drop:focus-visible { border-color: var(--blue); background: #f0f6ff; }
  .drop.over { border-color: var(--blue); background: #e6f0ff; border-style: solid; }
  .drop b { display: block; font: 600 18px var(--head); margin-bottom: 4px; }
  .drop small { color: var(--mute); font-size: 14px; }
  .file { display: none; align-items: center; gap: 12px; }
  .file .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .sub { color: var(--mute); font-size: 14px; }
  .file .grow { min-width: 0; flex: 1; }
  .loaded .drop { display: none; } .loaded .file { display: flex; }
  .bar { height: 4px; background: var(--pale); border-radius: 4px; overflow: hidden; margin-top: 12px; opacity: 0; transition: opacity .2s; }
  .busy .bar { opacity: 1; }
  .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .15s; }
  .btn { border: 2px solid var(--edge); background: #fff; border-radius: 12px; padding: 7px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn:hover { border-color: var(--blue); }
  .nav { display: none; align-items: center; gap: 6px; }
  .nav button { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--edge); background: #fff; font-size: 16px; line-height: 1; padding: 0; }
  .nav button:hover:not(:disabled) { border-color: var(--blue); } .nav button:disabled { opacity: .35; cursor: default; }
  .nav span { min-width: 74px; text-align: center; font-size: 14px; color: var(--mute); font-weight: 600; }

  /* 2 · phonemes */
  .phonemes { display: flex; flex-wrap: wrap; gap: 8px 6px; min-height: 44px; align-content: flex-start; }
  .ph { background: var(--navy); color: #fff; font: 700 15px var(--body); padding: 8px 12px; border-radius: 10px; animation: pop .22s ease-out backwards; }
  .gap { width: 14px; }
  .placeholder { color: #9fb0cf; font-size: 16px; }
  .note { color: var(--mute); font-size: 14px; }

  /* 3 · sentence */
  .sentence { font: 600 clamp(24px, 4.4vw, 32px)/1.3 var(--head); letter-spacing: -.01em; min-height: 44px; overflow-wrap: anywhere; animation: fade .25s ease-out; }
  .sentence.err { font: 600 15px var(--body); color: var(--bad); }
  .speak { border: 2px solid var(--edge); background: #fff; border-radius: 12px; width: 38px; height: 38px; display: none; place-items: center; padding: 0; }
  .speak:hover { border-color: var(--blue); } .speak.on { border-color: var(--blue); background: var(--pale); }
  .speak svg { width: 20px; height: 20px; }
  .demo { margin-top: 22px; text-align: center; font-size: 13px; color: var(--mute); display: none; }
  .demo.show { display: block; } .demo.err { color: var(--bad); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.9); } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 44 44" aria-hidden="true"><defs>
      <radialGradient id="lg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f7df0"/><stop offset=".55" stop-color="#5b9bf0"/><stop offset="1" stop-color="#5b9bf0" stop-opacity="0"/></radialGradient>
      <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b9bf0"/><stop offset="1" stop-color="#bcd5fa"/></linearGradient></defs>
      <g stroke="url(#rg)" stroke-width="4.2" stroke-linecap="round">
        <path d="M22 3.5v8M22 32.5v8M3.5 22h8M32.5 22h8M9 9l5.6 5.6M29.4 29.4 35 35M35 9l-5.6 5.6M14.6 29.4 9 35"/>
        <path d="M22 9v4M22 31v4M9 22h4M31 22h4" opacity=".55"/></g>
      <circle cx="22" cy="22" r="11" fill="url(#lg)"/></svg>
    <b>Thought-to-Text</b>
  </div>
  <h1>Try it live</h1>

  <section class="card active" id="c1">
    <header><span class="num">1</span><h2>Input</h2>
      <div class="side"><div class="nav" id="nav"><button id="prev" aria-label="Previous sentence">‹</button><span id="count"></span><button id="next" aria-label="Next sentence">›</button></div></div>
    </header>
    <div class="body" id="inBody">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an HDF5 file">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div><b>Drop a brain-data file here</b><small>.hdf5 · or click to browse</small>
      </div>
      <div class="file" id="file">
        <div class="grow"><div class="name" id="fname"></div><div class="sub" id="fsub"></div></div>
        <button class="btn" id="newBtn">New file</button>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <input type="file" id="fileInput" accept=".hdf5,.h5,.hdf" hidden>
    </div>
  </section>

  <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15m-6-6 6 6 6-6"/></svg></div>

  <section class="card" id="c2">
    <header><span class="num">2</span><h2>Phonemes</h2><div class="side">the sounds the model decoded</div></header>
    <div class="body"><div class="phonemes" id="phonemes"><span class="placeholder">Waiting for a file…</span></div></div>
  </section>

  <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15m-6-6 6 6 6-6"/></svg></div>

  <section class="card" id="c3">
    <header><span class="num">3</span><h2>Sentence</h2>
      <div class="side"><button class="speak" id="speak" aria-label="Read aloud" title="Read aloud"></button></div>
    </header>
    <div class="body"><div class="sentence" id="sentence"><span class="placeholder" style="font:400 16px var(--body)">Waiting for a file…</span></div></div>
  </section>

  <div class="demo" id="demo"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const S = { results: [], sel: -1, total: 0, xhr: null };

/* ---------- is the real model connected? ---------- */
(async function status() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json(), d = $('demo');
    if (s.load_error) { d.textContent = 'The model failed to load. See the server terminal for the error.'; d.className = 'demo show err'; }
    else if (s.demo) { d.textContent = 'Demo mode: no model connected yet, so these are placeholder results.'; d.className = 'demo show'; }
    else d.className = 'demo';
  } catch { $('demo').textContent = 'Can’t reach the server. Is it running?'; $('demo').className = 'demo show err'; }
})();

/* ---------- drop a file ---------- */
const drop = $('drop'), input = $('fileInput');
drop.addEventListener('click', () => input.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
$('newBtn').addEventListener('click', () => input.click());
input.addEventListener('change', () => { if (input.files[0]) decodeFile(input.files[0]); input.value = ''; });
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
window.addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
window.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) decodeFile(f); });

/* ---------- upload; predictions stream back one trial at a time ---------- */
function decodeFile(file) {
  if (S.xhr) S.xhr.abort();
  stopSpeaking();
  Object.assign(S, { results: [], sel: -1, total: 0 });
  $('nav').style.display = 'none';
  $('inBody').classList.add('loaded', 'busy');
  $('fname').textContent = file.name; $('fsub').textContent = 'Uploading…'; $('barFill').style.width = '0%';
  setStage(1); showPhonemes(null); showSentence(null);

  const xhr = S.xhr = new XMLHttpRequest(), form = new FormData(); form.append('file', file);
  let seen = 0;
  xhr.open('POST', '/api/decode');
  xhr.upload.onprogress = e => { if (e.lengthComputable) { $('barFill').style.width = (e.loaded / e.total * 60) + '%'; if (e.loaded === e.total) $('fsub').textContent = 'Decoding…'; } };
  const pump = () => {
    if (xhr !== S.xhr || xhr.status !== 200) return;
    const text = xhr.responseText; let nl;
    while ((nl = text.indexOf('\n', seen)) !== -1) { const line = text.slice(seen, nl); seen = nl + 1; if (line.trim()) onMessage(JSON.parse(line)); }
  };
  xhr.onprogress = pump;
  xhr.onload = () => {
    if (xhr !== S.xhr) return;
    if (xhr.status !== 200) { let m = 'Server error (' + xhr.status + ')'; try { m = JSON.parse(xhr.responseText).error || m; } catch {} return fail(m); }
    pump(); if (S.xhr === xhr) finish();
  };
  xhr.onerror = () => { if (xhr === S.xhr) fail('Can’t reach the model server. Is it still running?'); };
  xhr.send(form);
}

function onMessage(m) {
  if (m.type === 'start') S.total = m.n_trials;
  else if (m.type === 'fatal') fail(m.error);
  else if (m.type === 'trial') {
    const i = S.results.push(m) - 1;
    $('barFill').style.width = (60 + 40 * S.results.length / Math.max(1, S.total)) + '%';
    $('fsub').textContent = 'Decoding ' + S.results.length + ' of ' + S.total + '…';
    updateNav();
    if (i === 0) select(0);
  }
}
function finish() {
  S.xhr = null; $('inBody').classList.remove('busy');
  $('fsub').textContent = S.total + (S.total === 1 ? ' sentence' : ' sentences') + ' decoded';
}
function fail(msg) {
  S.xhr = null; $('inBody').classList.remove('loaded', 'busy');
  showPhonemes(null); showSentence({ error: msg }); setStage(0);
}

/* ---------- the three boxes ---------- */
function select(i) {
  const r = S.results[i]; if (!r) return;
  S.sel = i; updateNav();
  if (r.error) { showPhonemes(null, 'No phonemes for this one.'); showSentence(r); setStage(1); return; }
  const ph = toList(r.phonemes);
  setStage(2); showPhonemes(ph, ph ? null : 'This model did not return phonemes.');
  const delay = ph ? Math.min(450, ph.length * 14 + 120) : 0;      // let the phonemes land, then the sentence
  clearTimeout(select.t);
  select.t = setTimeout(() => { if (S.sel !== i) return; setStage(3); showSentence(r); speak(r.text); }, delay);
}
const toList = p => p == null ? null : (Array.isArray(p) ? p : String(p).split(/\s+/)).filter(Boolean).map(t => /^(sil|<sil>)$/i.test(t) ? '|' : t);
function showPhonemes(list, note) {
  const el = $('phonemes'); el.textContent = '';
  if (!list) { const s = document.createElement('span'); s.className = 'placeholder'; s.textContent = note || 'Waiting for a file…'; el.append(s); return; }
  list.forEach((p, k) => {
    if (p === '|') { const g = document.createElement('span'); g.className = 'gap'; el.append(g); return; }
    const s = document.createElement('span'); s.className = 'ph'; s.textContent = p; s.style.animationDelay = Math.min(k * 12, 400) + 'ms'; el.append(s);
  });
}
function showSentence(r) {
  const el = $('sentence'); el.className = 'sentence'; el.textContent = '';
  $('speak').style.display = r && !r.error ? 'grid' : 'none';
  if (!r) { const s = document.createElement('span'); s.className = 'placeholder'; s.style.font = '400 16px var(--body)'; s.textContent = 'Waiting for a file…'; el.append(s); return; }
  if (r.error) { el.className = 'sentence err'; el.textContent = r.error; return; }
  el.textContent = r.text || '(empty)';
}
function setStage(n) {      // highlight the box that is working / just finished
  ['c1', 'c2', 'c3'].forEach((id, k) => { $(id).classList.toggle('active', k === Math.max(0, n - 1)); $(id).classList.toggle('done', k < n - 1 || (n === 3 && k === 2)); });
  $('c1').classList.toggle('done', n >= 2);
}

/* ---------- step through the sentences in the file ---------- */
function updateNav() {
  const many = S.results.length > 1 || S.total > 1;
  $('nav').style.display = many ? 'flex' : 'none';
  $('count').textContent = (S.sel + 1) + ' of ' + (S.total || S.results.length);
  $('prev').disabled = S.sel <= 0; $('next').disabled = S.sel >= S.results.length - 1;
}
$('prev').addEventListener('click', () => select(S.sel - 1));
$('next').addEventListener('click', () => select(S.sel + 1));
document.addEventListener('keydown', e => {
  if (!S.results.length) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); select(Math.min(S.results.length - 1, S.sel + 1)); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); select(Math.max(0, S.sel - 1)); }
});

/* ---------- read it aloud ---------- */
const canSpeak = 'speechSynthesis' in window;
const SPEAKER = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
$('speak').innerHTML = SPEAKER;
if (!canSpeak) $('speak').remove();
function speak(text) {
  if (!canSpeak || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => $('speak').classList.add('on'); u.onend = u.onerror = () => $('speak').classList.remove('on');
  speechSynthesis.speak(u);
}
function stopSpeaking() { if (canSpeak) { speechSynthesis.cancel(); $('speak').classList.remove('on'); } }
$('speak').addEventListener('click', () => { if ($('speak').classList.contains('on')) stopSpeaking(); else { const r = S.results[S.sel]; if (r) speak(r.text); } });
</script>
</body>
</html>
